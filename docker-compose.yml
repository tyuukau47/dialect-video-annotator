services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dialect_video_annotator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DVA_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dialect_video_annotator
      DVA_CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
